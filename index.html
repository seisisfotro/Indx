*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{height:100%;margin:0}
input,textarea,select{font-size:max(16px,1em)}
body{background:radial-gradient(900px 480px at 85% -15%,#cde6ff,transparent),radial-gradient(700px 400px at -10% 110%,#dcefff,transparent),var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
header h1{font-size:1.05rem;margin:0;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.bt{min-width:0;display:flex;flex-direction:column;line-height:1.2}.bt b{letter-spacing:.06em}.bt small{color:var(--mute);font-size:.78rem;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{flex:none;width:40px;height:40px;background:var(--cat) center/contain no-repeat}
.ic{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.ic:hover{border-color:var(--accent)}
.ic i{display:block;width:16px;height:2px;background:var(--ink);box-shadow:0 5px 0 var(--ink),0 -5px 0 var(--ink)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--mute);flex:none}
.ghost:hover{color:var(--ink);border-color:var(--mute)}
#side{position:fixed;inset:0 auto 0 0;width:min(310px,86vw);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .22s;z-index:20;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0)) 12px calc(12px + env(safe-area-inset-bottom,0))}
#side.open{transform:none}
#ov{position:fixed;inset:0;background:rgba(15,42,71,.35);z-index:19;display:none}#ov.open{display:block}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:650}
#q{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 36px;color:inherit;font:inherit;margin:0}
.sq{position:relative;margin-bottom:10px}
.sq svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
#list li{display:flex;align-items:center;border-radius:10px}
#list li.on,#list li:hover{background:var(--user)}
.ct{flex:1;min-width:0;background:none;border:0;text-align:left;padding:9px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{background:none;border:0;color:var(--mute);padding:6px 8px;border-radius:8px}.mini:hover{color:var(--ink)}
.nochat{color:var(--mute);padding:10px}
main{flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column}
.wrap{width:100%;flex:1 0 auto;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.empty{margin:auto;text-align:center;padding:0 8px 8vh;animation:up .7s ease both}

  const ul=document.createElement('div');ul.className='vl';
  const mark=()=>[...ul.children].forEach((b,i)=>b.classList.toggle('on',i===cur));

    b.onclick=()=>{cur=i;try{localStorage.setItem('kvoice6',String(i))}catch(e){}mark();say(i,'Halo, ini suara yang kamu pilih.')};ul.appendChild(b)});
  mark();box.appendChild(ul);

}
function speak(body,b){
  if(!TTS)return;
  if(talk&&talk.b===b){stopTalk();return}
  stopTalk();
  const c=body.cloneNode(true);c.querySelectorAll('.codebox,.src').forEach(x=>x.remove());
  const text=c.textContent.replace(/\p{Extended_Pictographic}|\uFE0F/gu,' ').replace(/\s+/g,' ').trim();
  if(!text)return;
  const parts=text.match(/[^.!?;:\n]+[.!?;:]*\s*/g)||[text],chunks=[];let cur='';
  parts.forEach(p=>{if((cur+p).length>180&&cur){chunks.push(cur);cur=p}else cur+=p});if(cur)chunks.push(cur);
  const my=++tok,v=pickVoice();
  talk={b};b.innerHTML=IC.stop;b.classList.add('on');b.title='Hentikan suara';
  chunks.forEach((t,i)=>{
    const u=new SpeechSynthesisUtterance(t.trim());u.lang=v.voice?v.voice.lang:'id-ID';if(v.voice)u.voice=v.voice;u.pitch=v.p;u.rate=v.r;
    const end=()=>{if(my===tok&&i===chunks.length-1)stopTalk()};
    u.onend=end;u.onerror=()=>{if(my===tok)stopTalk()};
    speechSynthesis.speak(u);
  });
}
let tt=0;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2200)}
function react(m,t,lk,dk){
  m.fb=m.fb===t?null:t;if(m.fb==='like'&&!m.thx){m.thx=true;toast('Terimakasih atas jempolnya!')}save();
  lk.classList.toggle('on',m.fb==='like');dk.classList.toggle('on',m.fb==='dislike');
  lk.setAttribute('aria-pressed',m.fb==='like');dk.setAttribute('aria-pressed',m.fb==='dislike');
}
/* Lampiran file & foto */
const memImgs=new Map();let pend=[],ld=[],uploading=false;
const MAXF=4,TXT=/\.(txt|md|csv|json|html?|css|jsx?|tsx?|py|php|xml|sql|log|java|c|cpp|cs|go|rb|sh|ya?ml)$/i;
let pvOpen=false;
function viewImg(src,name){
  if(pvOpen)return;pvOpen=true;
  const ov=document.createElement('div');ov.className='pv';
  const im=document.createElement('img');im.src=src;im.alt=name||'Foto';
  const bk=document.createElement('button');bk.type='button';bk.className='pvb';bk.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Kembali</span>';
  let pushed=false;try{history.pushState({pv:1},'');pushed=true}catch(e){}
  const close=()=>{if(!pvOpen)return;pvOpen=false;window.removeEventListener('popstate',onpop);document.removeEventListener('keydown',kd);ov.remove()};
  const onpop=()=>close(),kd=e=>{if(e.key==='Escape')back()};
  const back=()=>{if(pushed){pushed=false;history.back()}else close()};
  bk.onclick=back;ov.onclick=e=>{if(e.target!==im)back()};
  window.addEventListener('popstate',onpop);document.addEventListener('keydown',kd);
  ov.append(im,bk);document.body.appendChild(ov);
}
function chip(f,onrm){
  if(f.kind==='img'&&f.thumb){
    const c=document.createElement('div');c.className='fc pic';
    const im=document.createElement('img');im.src=f.thumb;im.alt=f.name||'Foto';im.title='Ketuk untuk melihat foto';im.tabIndex=0;
    im.onclick=()=>viewImg(f.view||f.thumb,f.name);im.onkeydown=e=>{if(e.key==='Enter')viewImg(f.view||f.thumb,f.name)};
    c.appendChild(im);
    if(onrm){const x=document.createElement('button');x.type='button';x.textContent='✕';x.setAttribute('aria-label','Hapus foto');x.onclick=onrm;c.appendChild(x)}
    return c;
  }
  const c=document.createElement('div');c.className='fc';
  if(f.thumb){const im=document.createElement('img');im.src=f.thumb;im.alt='';c.appendChild(im)}
  else{const i=document.createElement('i');i.innerHTML=IC.file;c.appendChild(i)}
  const n=document.createElement('span');n.textContent=f.name;n.title=f.name;c.appendChild(n);
  if(onrm){const x=document.createElement('button');x.type='button';x.textContent='✕';x.setAttribute('aria-label','Hapus file');x.onclick=onrm;c.appendChild(x)}
  return c;
}
function drawTray(){
  const t=$('tray');t.innerHTML='';
  pend.forEach((f,i)=>t.appendChild(chip(f,()=>{if(uploading)return;pend.splice(i,1);drawTray();updateGo()})));
  ld.forEach(n=>{const c=document.createElement('div');c.className='fc ld';const sp=document.createElement('i');sp.className='sp';const nm=document.createElement('span');nm.textContent='Memproses '+n+'…';c.append(sp,nm);t.appendChild(c)});
  t.classList.toggle('on',pend.length>0||ld.length>0);
}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function shrink(im,max,q){const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',q)}
async function addFiles(list){
  if(uploading){toast('Tunggu sebentar, file sebelumnya masih diproses');return}
  if(!list.length)return;
  uploading=true;$('at').disabled=true;ld=list.map(f=>f.name);drawTray();updateGo();
  for(const f of list){
    await new Promise(r=>setTimeout(r,600));
    try{
      if(pend.length>=MAXF){toast('Maksimal '+MAXF+' file sekali kirim');ld=[];break}
      if(f.size>10*1024*1024){toast(f.name+' terlalu besar (maks 10 MB)');continue}
      if(f.type.startsWith('image/')&&pend.filter(x=>x.kind==='img').length>=3){toast('Maksimal 3 foto sekali kirim');continue}
      if(f.type.startsWith('image/')){const im=await loadImg(f);pend.push({name:f.name,kind:'img',data:shrink(im,1280,.85).split(',')[1],thumb:shrink(im,240,.72),view:shrink(im,720,.7)})}
      else if(f.type.startsWith('text/')||f.type==='application/json'||TXT.test(f.name)){let t=await f.text(),cut=false;if(t.length>12000){t=t.slice(0,12000);cut=true}pend.push({name:f.name,kind:'txt',text:t,cut})}
      else toast('Format '+f.name+' belum didukung')
    }catch(e){toast('Gagal membaca '+f.name)}
    finally{ld=ld.filter(n=>n!==f.name);drawTray()}
  }
  uploading=false;ld=[];$('at').disabled=false;drawTray();updateGo();
}
async function shareAns(m){
  const c=cur(),base=((c&&c.title||'').replace(/[^\w\- ]+/g,'').trim()||'jawaban-kelvin').slice(0,40),name=base+'.txt';
  const file=new File([m.content],name,{type:'text/plain'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:base});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  toast('Jawaban disimpan sebagai '+name);
}
function srcs(a){const s=document.createElement('div');s.className='src';a.forEach(x=>{const l=document.createElement('a');l.href=x.url;l.target='_blank';l.rel='noopener noreferrer';l.textContent=x.title;s.appendChild(l)});return s}
function addMsg(m,i,last){
  const el=document.createElement('div');
  if(m.role==='user'){
    el.className='msg user';
    if(m.files&&m.files.length){const fs=document.createElement('div');fs.className='fs';m.files.forEach(f=>fs.appendChild(chip(f)));el.appendChild(fs)}
    const t=document.createElement('div');t.className='t';t.textContent=m.content;
    const e=ib(IC.edit,'Edit pesan',()=>editMsg(el,i),'act');const ur=document.createElement('div');ur.className='ur';ur.append(t,e);el.appendChild(ur);
  }else{
    el.className='msg ai';const b=document.createElement('div');b.className='body';b.append(...render(m.content).childNodes);
    if(m.sources&&m.sources.length)b.appendChild(srcs(m.sources));
    const a=document.createElement('div');a.className='acts';
    const cb=ib(IC.copy,'Salin',()=>copy(m.content,cb));
    const lk=ib(IC.up,'Suka',()=>react(m,'like',lk,dk));

    lk.setAttribute('aria-pressed',m.fb==='like');dk.setAttribute('aria-pressed',m.fb==='dislike');
    a.append(cb);
    if(TTS){const sp=ib(IC.spk,'Dengarkan',()=>speak(b,sp),'talk');a.append(sp)}
    a.append(lk,dk,ib(IC.share,'Bagikan jawaban (.txt)',()=>shareAns(m)));
    el.append(b,a);
  }
  log.appendChild(el);
}
function show(){
  twTok++;stopTalk();list();const c=cur();$('ttl').textContent=c&&c.msgs.length?c.title:'Siap membantu kamu';setPh(c);
  log.innerHTML='';if(!c||!c.msgs.length){empty();return}
  c.msgs.forEach((m,i)=>addMsg(m,i,i===c.msgs.length-1));main.scrollTop=main.scrollHeight;
}
function editMsg(el,i){
  if(busy||locked)return;const c=cur();el.className='msg edit';el.innerHTML='';
  const t=document.createElement('textarea');t.value=c.msgs[i].content;t.rows=3;t.maxLength=20000;
  const row=document.createElement('div');row.className='erow';
  const ok=btn('Kirim ulang','',()=>{const v=t.value.trim();if(!v)return;const o=c.msgs[i],nm={role:'user',content:v};if(o.att)nm.att=o.att;const kf=(o.files||[]).filter(f=>f.kind!=='img');if(kf.length)nm.files=kf;c.msgs=c.msgs.slice(0,i);c.msgs.push(nm);if(i===0&&c.auto)c.title=mkTitle(v);save();show();ask()});ok.className='send';
  row.append(btn('Batal','',()=>show()),ok);el.append(t,row);t.focus();
}
function regen(){if(busy||locked)return;const c=cur();if(c.msgs.length&&c.msgs[c.msgs.length-1].role==='assistant')c.msgs.pop();save();show();ask()}
function reveal(el,text){return new Promise(res=>{
  el.innerHTML='';const b=document.createElement('div');b.className='body';el.appendChild(b);
  const step=Math.max(6,Math.ceil(text.length/80));let n=0;
  (function f(){n=Math.min(text.length,n+step);
    b.innerHTML=DOMPurify.sanitize(marked.parse(text.slice(0,n),{breaks:true}));tagNote(b);
    main.scrollTop=main.scrollHeight;n<text.length?requestAnimationFrame(f):res()})();
})}
const touch=()=>matchMedia('(pointer:coarse)').matches;
const kb=()=>{if(!touch())inp.focus()};
function updateGo(){go.disabled=busy||uploading||locked;go.classList.toggle('on',!busy&&!uploading&&(!!inp.value.trim()||pend.length>0))}
function dlg(o){return new Promise(res=>{
  const ov=document.createElement('div');ov.className='dov';
  const box=document.createElement('div');box.className='dbox';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
  const h=document.createElement('h3');h.textContent=o.title;box.appendChild(h);
  if(o.text){const p=document.createElement('p');p.textContent=o.text;box.appendChild(p)}
  let f=null;if(o.input!==undefined){f=document.createElement('input');f.value=o.input;f.maxLength=60;box.appendChild(f)}
  const kd=e=>{if(e.key==='Escape')done(null);else if(e.key==='Enter'&&f)done(f.value)};
  const done=v=>{ov.remove();document.removeEventListener('keydown',kd);res(v)};
  const row=document.createElement('div');row.className='drow';
  const yes=btn(o.ok,'',()=>done(f?f.value:true));yes.className=o.danger?'dyes danger':'dyes';
  row.append(btn('Batal','',()=>done(null)),yes);box.appendChild(row);ov.appendChild(box);
  ov.onclick=e=>{if(e.target===ov)done(null)};
  document.addEventListener('keydown',kd);document.body.appendChild(ov);
  if(f){f.focus();f.select()}else yes.focus();
})}
async function ask(){
  if(locked)return;
  const c=cur();c.pending=false;busy=true;updateGo();
  const lastObj=c.msgs[c.msgs.length-1],imgs=memImgs.get(lastObj)||[],lastMsg=lastObj.content,web=canSearch&&WEB.test(lastMsg);
  const kind=CODE.test(lastMsg)?'code':web?'web':QUES.test(lastMsg)?'ask':'think',steps=LOAD[kind];
  const el=document.createElement('div');el.className='msg ai';
  el.innerHTML='<div class="think k-'+(kind==='ask'?'web':kind)+'"><i class="ico"></i><span class="shim"></span><i class="bar"></i></div>';
  const sh=el.querySelector('.shim');sh.textContent=steps[0];let k=0;
  const iv=setInterval(()=>{k=Math.min(k+1,steps.length-1);sh.textContent=steps[k]},2400);
  log.appendChild(el);main.scrollTop=main.scrollHeight;
  let ok=false;
  try{
    let j;
    if(GREET.test(lastMsg)&&!lastObj.files){await new Promise(r=>setTimeout(r,250));j={reply:greetReply(lastMsg)}}
    else if(THANKS.test(lastMsg)&&!lastObj.files){await new Promise(r=>setTimeout(r,250));j={reply:rnd(THXR)}}
    else if(c.msgs.length===1&&!lastObj.files&&!CODEONLY.test(lastMsg)&&codeOnlyMsg(lastMsg)){await new Promise(r=>setTimeout(r,700));j={reply:ASKCODE}}
    else{
      const r=await fetch('api/chat.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.msgs.map((m,i)=>({role:m.role,content:m.content+(m.att||'')+(i===c.msgs.length-1?(CODEONLY.test(m.content)?ONLYHINT:(kind==='code'?CODEHINT:'')+(USERHI.test(m.content)?STYLEHINT.replace(/langsung ke inti[^.]*\./,''):STYLEHINT)):'')})),search:web,...(imgs.length?{images:imgs}:{})})});
      const raw=await r.text();
      try{j=JSON.parse(raw)}catch(_){console.error('KELVIN server error',r.status,raw.slice(0,300));throw new Error('KELVIN sedang tidak bisa dihubungi 🛠️ Coba lagi beberapa saat lagi')}
      if(j.limit){const le=new Error('limit');le.limit=j;throw le}
      if(!r.ok||j.error)throw new Error(j.error||'Terjadi kesalahan, coba lagi');
    }
    j.reply=clean(j.reply,lastMsg);if(j.truncated)j.reply+='\n\nNote: Jawaban masih terpotong karena batas panjang. Ketik "lanjutkan" untuk meneruskan.';clearInterval(iv);await reveal(el,j.reply);
    c.msgs.push({role:'assistant',content:j.reply,sources:j.sources||[]});c.ts=Date.now();save();ok=true;
  }catch(e){
    if(e&&e.limit){
      clearInterval(iv);el.remove();c.pending=true;save();
      busy=false;lockUI(e.limit.reset,e.limit.now);updateGo();return;
    }
    clearInterval(iv);el.innerHTML='';const s=document.createElement('div');s.className='err';s.textContent=e instanceof TypeError?'Koneksi internetmu bermasalah atau server tidak bisa dihubungi 📡 Coba lagi sebentar lagi':e.message;
    const a=document.createElement('div');a.className='acts';a.append(btn('Coba lagi','',()=>{if(busy)return;el.remove();ask()}));el.append(s,a);
  }
  busy=false;updateGo();if(ok)show();kb();main.scrollTop=main.scrollHeight;
}
const mkTitle=t=>{t=String(t).replace(/\s+/g,' ').trim();return t.length>40?t.slice(0,40).trim()+'…':t};
function sendMsg(t){
  if(locked)return;
  const typed=(t===undefined?inp.value:t).trim();if(uploading){toast('Tunggu sampai file selesai diproses');return}if((!typed&&!pend.length)||busy)return;
  const text=typed||'Tolong lihat file ini.';
  inp.value='';inp.style.height='auto';if(touch())inp.blur();
  const c=cur()||newChat();if(!c.msgs.length){c.title=mkTitle(text);c.auto=true}
  const m={role:'user',content:text};
  if(pend.length){
    m.files=pend.map(f=>({name:f.name,kind:f.kind,thumb:f.thumb,view:f.view}));
    const tx=pend.filter(f=>f.kind==='txt');
    if(tx.length)m.att=tx.map(f=>'\n\n[Isi file: '+f.name+(f.cut?' (dipotong)':'')+']\n'+f.text+'\n[Akhir file]').join('');
    const im=pend.filter(f=>f.kind==='img').map(f=>({name:f.name,mime:'image/jpeg',data:f.data}));
    if(im.length)memImgs.set(m,im);
    pend=[];drawTray();
  }
  c.msgs.push(m);save();show();ask();
}

inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!touch()){e.preventDefault();sendMsg()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px';updateGo()});
const fresh=()=>{const c=cur();if(!c||!c.msgs.length){side(false);kb();return}db.cur=null;save();show();side(false);kb()};
$('nw').onclick=$('nw2').onclick=fresh;
$('mn').onclick=()=>side(true);$('cl').onclick=$('ov').onclick=()=>side(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')side(false)});

$('exp').onclick=()=>{const c=cur();if(!c||!c.msgs.length)return;

db.cur=null;save();
show();updateGo();
